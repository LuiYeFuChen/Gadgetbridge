name: Build W2 APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null | head -10 || true
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      # JitPack 上的 com.github.Freeyourgadget:greendao 已无法构建（缺 android-23 SDK），
      # 但 fork 的 DaoGenerator 是纯 Java（只依赖 freemarker），直接在 CI 里编译成 jar 供 GBDaoGenerator 使用。
      # 这个 fork 修了「多次 .primaryKey() 调用生成复合主键」的问题，官方 2.2.0 不支持，会导致建表 SQL 报错。
      - name: Build greenDAO fork generator jar
        run: |
          set -e
          # 必须精确检出 commit 1998d7c —— 它是唯一带「复合主键」支持的版本：
          #   dao.ftl 会收集所有 PK 列并在建表语句末尾生成 PRIMARY KEY (a,b,c) ON CONFLICT REPLACE) WITHOUT ROWID
          # 而该仓库 master 已把此修复回退（dao.ftl 中没有 pks/WITHOUT ROWID），用 master 会生成
          # 多个单列 PRIMARY KEY 的非法建表语句，导致 App 启动即崩（SQLiteException: more than one primary key）。
          rm -rf /tmp/gdao && mkdir -p /tmp/gdao && cd /tmp/gdao
          git init -q
          git remote add origin https://github.com/Freeyourgadget/greenDAO.git
          git fetch -q --depth 1 origin 1998d7cd2d21f662c6044f6ccf3b3a251bbad341
          git checkout -q FETCH_HEAD
          echo "checked out: $(git rev-parse HEAD)"
          grep -c "WITHOUT ROWID" DaoGenerator/src-template/dao.ftl | xargs -I{} echo "composite-PK support markers: {}"
          curl -sL -o /tmp/freemarker.jar https://repo.maven.apache.org/maven2/org/freemarker/freemarker/2.3.23/freemarker-2.3.23.jar
          mkdir -p /tmp/gdao-out "$GITHUB_WORKSPACE/libs"
          find DaoGenerator/src -name "*.java" > /tmp/srcs.txt
          echo "compiling $(wc -l < /tmp/srcs.txt) source files"
          javac -nowarn -source 8 -target 8 -cp /tmp/freemarker.jar -d /tmp/gdao-out @/tmp/srcs.txt
          jar cf "$GITHUB_WORKSPACE/libs/greendao-generator-fork.jar" -C /tmp/gdao-out . -C DaoGenerator/src-template .
          unzip -l "$GITHUB_WORKSPACE/libs/greendao-generator-fork.jar" | grep -c "\.ftl" | xargs -I{} echo "templates in jar: {}"
          ls -lh "$GITHUB_WORKSPACE/libs/"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-w2-debug
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
