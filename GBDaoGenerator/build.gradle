apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin:'application'

archivesBaseName = 'gadgetbridge-daogenerator'

dependencies {
    // 原为 JitPack 上的 Freeyourgadget fork（com.github.Freeyourgadget:greendao:1998d7cd...），
    // 该构建在 JitPack 上已不可用（缺 android-23 SDK）。
    // 现由 CI 直接从 fork 源码编译成 libs/greendao-generator-fork.jar（见 .github/workflows/build-apk.yml）。
    // 必须用这个 fork：它支持「多次 .primaryKey() 生成复合主键」，官方 2.2.0 会生成多主键的非法建表语句。
    implementation files("${rootProject.projectDir}/libs/greendao-generator-fork.jar")
    implementation 'org.freemarker:freemarker:2.3.23'
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
}

mainClassName = "nodomain.freeyourgadget.gadgetbridge.daogen.GBDaoGenerator"

tasks.register('genSources', JavaExec) {
    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = '../'
}

artifacts {
    archives jar
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.named("distTar") {
    duplicatesStrategy = 'include'
}

tasks.named("distZip") {
    duplicatesStrategy = 'include'
}
