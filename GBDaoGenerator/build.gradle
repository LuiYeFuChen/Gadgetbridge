apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin:'application'

archivesBaseName = 'gadgetbridge-daogenerator'

dependencies {
    // 原为 JitPack 上的 Freeyourgadget fork（com.github.Freeyourgadget:greendao:1998d7cd...），
    // 该构建在 JitPack 上已不可解析，改用 Maven Central 的官方 2.x 生成器（同一 de.greenrobot.daogenerator 包）
    implementation 'org.greenrobot:greendao-generator:2.2.0'
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
}

mainClassName = "nodomain.freeyourgadget.gadgetbridge.daogen.GBDaoGenerator"

tasks.register('genSources', JavaExec) {
    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = '../'
}

artifacts {
    archives jar
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.named("distTar") {
    duplicatesStrategy = 'include'
}

tasks.named("distZip") {
    duplicatesStrategy = 'include'
}
